    button { font: inherit; }
    .app {
      width: min(1680px, 100%);
      height: min(1100px, calc(100vh - 12px));
      min-height: 490px;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 26px;
      background: rgba(249,249,249,.88);
      box-shadow: 0 24px 80px rgba(15,15,15,.18), inset 0 1px rgba(255,255,255,.8);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }
    header { padding: 17px 30px 10px; display: flex; justify-content: space-between; align-items: end; gap: 20px; }
    .eyebrow { margin: 0 0 8px; color: #666; font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 3vw, 35px); line-height: 1.12; letter-spacing: -.045em; font-weight: 700; }
        .edition { flex: 0 0 auto; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.5); color: #656565; font-size: 11px; font-weight: 600; letter-spacing: .02em; }
    .controls { padding: 0 30px 10px; display: flex; align-items: center; gap: 13px; }
    .controls label { color: #777; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .picker { position: relative; z-index: 5; width: min(360px, 100%); }
    .picker-trigger {
      width: 100%; min-height: 48px; padding: 0 15px 0 17px;
      display: flex; align-items: center; justify-content: space-between; gap: 15px;
      border: 1px solid rgba(35,35,35,.12); border-radius: 14px;
      color: var(--ink); background: rgba(255,255,255,.9); cursor: pointer;
      font-size: 14px; font-weight: 600; text-align: left;
      box-shadow: 0 3px 10px rgba(30,30,30,.04);
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .picker-trigger:hover, .picker.open .picker-trigger { border-color: rgba(35,35,35,.28); box-shadow: 0 8px 22px rgba(30,30,30,.09); }
    .picker-trigger:active { transform: scale(.99); }
    .chevron { width: 17px; height: 17px; color: #777; transition: transform .2s ease; }
    .picker.open .chevron { transform: rotate(180deg); }
    .menu {
      position: absolute; top: calc(100% + 9px); left: 0; right: 0;
      padding: 7px; border: 1px solid rgba(35,35,35,.1); border-radius: 17px;
      background: rgba(255,255,255,.97); box-shadow: 0 18px 42px rgba(20,20,20,.17);
      backdrop-filter: blur(18px); transform-origin: top center; animation: pop .16s ease-out;
    }
    .menu[hidden] { display: none; }
    @keyframes pop { from { opacity: 0; transform: translateY(-5px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .menu-option {
      width: 100%; min-height: 39px; padding: 0 10px; display: flex; align-items: center; gap: 10px;
      border: 0; border-radius: 10px; color: #343434; background: transparent; cursor: pointer;
      font-size: 13px; font-weight: 500; text-align: left; transition: background .15s ease;
    }
    .menu-option:hover, .menu-option:focus-visible { outline: none; background: #f0efed; }
    .menu-option[aria-selected="true"] { background: #e9e8e6; font-weight: 700; }
    .option-mark { width: 7px; height: 7px; border-radius: 50%; background: #bbb; }
    .menu-option[aria-selected="true"] .option-mark { background: #444; box-shadow: 0 0 0 3px rgba(60,60,60,.1); }
    main {
      flex: 1; min-height: 0; margin: 0 12px 12px; padding: 18px 24px;
      border: 1px solid rgba(255,255,255,.75); border-radius: 19px;
      background: rgba(255,255,255,.65); overflow: visible;
    }
    main:focus { outline: none; }
    h2 { margin: 0 0 9px; padding-bottom: 8px; border-bottom: 1px solid rgba(40,40,40,.2); font-size: 25px; line-height: 1.2; letter-spacing: -.025em; }
    .section-note { margin: 0 0 9px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .stave-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .stave-card, .verb-card, .context-card {
      padding: 8px 12px; border: 1px solid rgba(40,40,40,.18); border-radius: 14px; background: var(--card);
      box-shadow: 0 2px 7px rgba(30,30,30,.025);
    }
    .stave-card:last-child { grid-column: 1 / -1; }
    .card-heading { display: flex; align-items: baseline; gap: 9px; margin: 0 0 9px; }
    .card-heading h3 { margin: 0; font-size: 17px; font-weight: 700; }
    .stave-number { color: #888; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .word-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .word-chip { position: relative; z-index: 0; padding: 3px 7px; border-radius: 7px; background: #f0efed; color: #353535; font-size: 16px; font-weight: 600; cursor: pointer; }
    .word-chip:hover, .word-chip:focus-visible { z-index: 12; outline: 2px solid rgba(70,70,70,.35); outline-offset: 1px; }
    .word-chip::after { content: attr(data-tooltip); position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 20; width: max-content; max-width: min(300px, 70vw); padding: 9px 11px; border-radius: 9px; background: #262626; color: white; box-shadow: 0 7px 22px rgba(0,0,0,.2); font-size: 14px; font-weight: 500; line-height: 1.4; white-space: normal; opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(4px); transition: opacity .14s ease, transform .14s ease, visibility .14s ease; }
    .word-chip:hover::after, .word-chip:focus-visible::after { opacity: 1; visibility: visible; transform: translateY(0); }
    .card-note { margin: 4px 0 0; color: #767676; font-size: 14px; line-height: 1.5; }
    .ghost-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .ghost-card { padding: 10px 12px; border: 1px solid rgba(40,40,40,.18); border-radius: 15px; background: var(--card); }
    .marley-card { grid-column: 1 / -1; }
    .marley-words { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .marley-words > .word-list + .word-list { border-left: 1px solid rgba(40,40,40,.22); padding-left: 18px; }
    .ghost-card h3, .verb-card h3, .context-card h3 { margin: 0 0 7px; font-size: 17px; line-height: 1.4; }
    .ghost-card p { margin: 0 0 11px; color: #777; font-size: 14px; line-height: 1.5; }
    .word-list { display: flex; flex-direction: column; gap: 4px; }
    .word { font-size: 15px; line-height: 1.35; color: #686868; }
    .word strong { color: #272727; font-weight: 700; }
    .verb-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; }
    .verb-card { min-height: 126px; }
    .verb-card h3 { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .verb-card p { margin: 0; color: #6d6d6d; font-size: 17px; line-height: 1.65; }
    .verb-card strong { color: #2d2d2d; }
    .starter-groups { display: grid; grid-template-columns: 1fr; gap: 5px; }
    .starter-group { padding: 8px 13px; border: 1px solid rgba(40,40,40,.18); border-radius: 14px; background: var(--card); }
    .starter-group h3 { margin: 0 0 5px; font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: .08em; }
    .starter-group ul, .context-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
    .starter-group li { padding-left: 12px; border-left: 2px solid #c7c7c7; color: #4e4e4e; font-size: 16px; line-height: 1.35; }
    .starter-group strong { color: #252525; }
    .context-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
    .context-card { display: flex; align-items: flex-start; gap: 12px; }
    .context-index { flex: 0 0 27px; height: 27px; border-radius: 9px; display: grid; place-items: center; background: #e9e8e6; color: #444; font-size: 11px; font-weight: 700; }
    .context-card h3 { margin-bottom: 5px; }
    .context-card p { margin: 0; color: #6f6f6f; font-size: 16px; line-height: 1.4; }
    .context-tip { margin-top: 13px; padding: 11px 13px; border-radius: 11px; background: rgba(232,231,229,.75); color: #656565; font-size: 13px; line-height: 1.5; }
    .quote-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .quote-card { position: relative; min-width: 0; padding: 14px 15px 14px 50px; border: 1px solid rgba(40,40,40,.18); border-radius: 13px; background: var(--card); }
    .quote-number { position: absolute; left: 13px; top: 14px; width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid rgba(40,40,40,.13); border-radius: 8px; background: #f0efed; color: #555; font-size: 11px; font-weight: 700; }
    .quote-card blockquote { margin: 0 0 7px; color: #292929; font-family: Georgia, serif; font-size: 18px; line-height: 1.45; }

    .quote-picker-trigger { width: 100%; min-height: 58px; padding: 7px 13px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(40,40,40,.16); border-radius: 15px; background: rgba(255,255,255,.94); color: #292929; text-align: left; cursor: pointer; box-shadow: 0 4px 12px rgba(30,30,30,.045); transition: border-color .16s ease, box-shadow .16s ease; }
    .quote-picker-trigger:hover, .quote-picker.open .quote-picker-trigger { border-color: rgba(40,40,40,.34); box-shadow: 0 8px 22px rgba(30,30,30,.1); }
    .quote-picker-number, .quote-option-number { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border-radius: 11px; background: #eeedeb; color: #444; font-size: 12px; font-weight: 750; }
    .quote-picker-current { display: flex; flex: 1; flex-direction: column; gap: 2px; }
    .quote-picker-current small, .quote-stave-option small { color: #85827d; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .quote-picker-current strong { font-size: 14px; font-weight: 700; }
    .quote-picker-trigger svg { width: 18px; height: 18px; color: #777; transition: transform .17s ease; }
    .quote-picker.open .quote-picker-trigger svg { transform: rotate(180deg); }
    .quote-picker-menu { position: absolute; top: calc(100% + 7px); left: 0; right: 0; padding: 6px; border: 1px solid rgba(40,40,40,.13); border-radius: 15px; background: rgba(255,255,255,.98); box-shadow: 0 16px 35px rgba(20,20,20,.15); transform-origin: top; animation: quote-pop .14s ease-out; }
    .quote-picker-menu[hidden] { display: none; }
    @keyframes quote-pop { from { opacity: 0; transform: translateY(-4px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .quote-stave-option { width: 100%; min-height: 49px; padding: 6px 9px; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 10px; background: transparent; color: #333; text-align: left; cursor: pointer; }
    .quote-stave-option:hover, .quote-stave-option:focus-visible, .quote-stave-option[aria-selected="true"] { outline: none; background: #f1f0ee; }
    .quote-stave-option > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .quote-stave-option strong { font-size: 13px; }
    .quote-stave-option small { letter-spacing: 0; text-transform: none; }
    .quote-option-check { color: #50504d; font-size: 15px; opacity: 0; }
    .quote-stave-option[aria-selected="true"] .quote-option-check { opacity: 1; }
    .quote-card p:last-child { margin: 0; color: #666; font-size: 14px; line-height: 1.5; }
    .starter-group, .context-card { border-color: rgba(40,40,40,.2); }
    .context-card + .context-card, .starter-group + .starter-group { position: relative; }
    @media (max-width: 760px) {
      body { padding: 8px; }
      .app { width: 100%; height: calc(100vh - 16px); min-height: 0; border-radius: 19px; }

<script>
const banks = {
  scrooge: `<h2>Scrooge</h2><p class="section-note">Track how Dickens presents Scrooge before and after his transformation.</p>
    <div class="stave-grid">
      <section class="stave-card overall-card"><div class="card-heading"><span class="stave-number">Overall</span><h3>Before redemption</h3></div><div class="word-row"><span class="word-chip">misanthropic</span><span class="word-chip">stingy</span><span class="word-chip">miserly</span><span class="word-chip">avaricious</span><span class="word-chip">parsimonious</span><span class="word-chip">selfish</span><span class="word-chip">callous</span><span class="word-chip">cold-hearted</span><span class="word-chip">hard-hearted</span><span class="word-chip">inhospitable</span><span class="word-chip">uncharitable</span><span class="word-chip">contemptuous</span><span class="word-chip">cynical</span><span class="word-chip">reclusive</span><span class="word-chip">joyless</span><span class="word-chip">isolated</span><span class="word-chip">curmudgeonly</span><span class="word-chip">covetous</span></div><p class="card-note">Before redemption, Dickens presents Scrooge as misanthropic, stingy and miserly.</p></section>
      <section class="stave-card"><div class="card-heading"><span class="stave-number">Stave One</span><h3>The miser</h3></div><div class="word-row"><span class="word-chip">miserly</span><span class="word-chip">avaricious</span><span class="word-chip">parsimonious</span><span class="word-chip">stingy</span><span class="word-chip">misanthropic</span><span class="word-chip">callous</span><span class="word-chip">inhospitable</span><span class="word-chip">contemptuous</span><span class="word-chip">isolated</span><span class="word-chip">joyless</span></div><p class="card-note">Dickens introduces him as cold, greedy and cut off from human connection.</p></section>
      <section class="stave-card"><div class="card-heading"><span class="stave-number">Stave Two</span><h3>The past remembered</h3></div><div class="word-row"><span class="word-chip">vulnerable</span><span class="word-chip">lonely</span><span class="word-chip">nostalgic</span><span class="word-chip">reflective</span><span class="word-chip">regretful</span><span class="word-chip">sentimental</span><span class="word-chip">wistful</span><span class="word-chip">receptive</span><span class="word-chip">pensive</span><span class="word-chip">emotionally exposed</span></div><p class="card-note">His memories expose the loneliness beneath his hard exterior and begin to awaken regret.</p></section>
      <section class="stave-card"><div class="card-heading"><span class="stave-number">Stave Three</span><h3>The present witnessed</h3></div><div class="word-row"><span class="word-chip">curious</span><span class="word-chip">attentive</span><span class="word-chip">empathetic</span><span class="word-chip">compassionate</span><span class="word-chip">concerned</span><span class="word-chip">ashamed</span><span class="word-chip">softened</span><span class="word-chip">protective</span><span class="word-chip">generous in spirit</span><span class="word-chip">socially aware</span></div><p class="card-note">He responds to the Cratchits and feels shame when confronted with Ignorance and Want.</p></section>
      <section class="stave-card"><div class="card-heading"><span class="stave-number">Stave Four</span><h3>The future feared</h3></div><div class="word-row"><span class="word-chip">terrified</span><span class="word-chip">desperate</span><span class="word-chip">remorseful</span><span class="word-chip">humbled</span><span class="word-chip">repentant</span><span class="word-chip">fearful</span><span class="word-chip">vulnerable</span><span class="word-chip">penitent</span><span class="word-chip">determined</span><span class="word-chip">hopeful</span></div><p class="card-note">The vision of his lonely death makes him recognise the consequences of his choices.</p></section>
      <section class="stave-card"><div class="card-heading"><span class="stave-number">Stave Five</span><h3>A changed man</h3></div><div class="word-row"><span class="word-chip">joyful</span><span class="word-chip">generous</span><span class="word-chip">benevolent</span><span class="word-chip">charitable</span><span class="word-chip">affectionate</span><span class="word-chip">jovial</span><span class="word-chip">rejuvenated</span><span class="word-chip">redeemed</span><span class="word-chip">sociable</span><span class="word-chip">socially responsible</span></div><p class="card-note">His actions prove that he has changed: he gives, reconnects and cares for others.</p></section>
    </div>`,
  ghosts: `<h2>The spirits and Jacob Marley</h2><p class="section-note">Use these words to describe how each ghost appears and the lesson they bring.</p><div class="ghost-grid">
    <section class="ghost-card"><h3>Ghost of Christmas Past</h3><p>Memory, childhood and the choices that shaped Scrooge.</p><div class="word-list"><div class="word"><strong>Ethereal</strong> - delicate and otherworldly</div><div class="word"><strong>Spectral</strong> - ghostly</div><div class="word"><strong>Luminous</strong> - glowing with light</div><div class="word"><strong>Radiant</strong> - shining brightly</div><div class="word"><strong>Mutable</strong> - able to change shape</div><div class="word"><strong>Androgynous</strong> - combining masculine and feminine qualities</div><div class="word"><strong>Childlike</strong> - seeming young or innocent</div><div class="word"><strong>Revelatory</strong> - uncovering something hidden</div><div class="word"><strong>Nostalgic</strong> - stirring memories of the past</div><div class="word"><strong>Reflective</strong> - encouraging careful thought</div></div></section>
    <section class="ghost-card"><h3>Ghost of Christmas Present</h3><p>Generosity, community and the lives of others now.</p><div class="word-list"><div class="word"><strong>Jovial</strong> - cheerful and sociable</div><div class="word"><strong>Genial</strong> - warm and friendly</div><div class="word"><strong>Benevolent</strong> - kind and generous</div><div class="word"><strong>Robust</strong> - strong and healthy</div><div class="word"><strong>Abundant</strong> - plentiful and overflowing</div><div class="word"><strong>Magnanimous</strong> - generous in spirit</div><div class="word"><strong>Festive</strong> - full of celebration</div><div class="word"><strong>Welcoming</strong> - making others feel accepted</div><div class="word"><strong>Fatherly</strong> - warm and protective</div><div class="word"><strong>Didactic</strong> - intended to teach a lesson</div></div></section>
    <section class="ghost-card"><h3>Ghost of Christmas Yet to Come</h3><p>Death, consequence and the possibility of change.</p><div class="word-list"><div class="word"><strong>Ominous</strong> - suggesting danger or trouble</div><div class="word"><strong>Foreboding</strong> - creating a sense of dread</div><div class="word"><strong>Sinister</strong> - threatening or evil</div><div class="word"><strong>Menacing</strong> - appearing dangerous</div><div class="word"><strong>Hooded</strong> - concealed beneath a dark covering</div><div class="word"><strong>Faceless</strong> - lacking a visible face</div><div class="word"><strong>Silent</strong> - communicating without words</div><div class="word"><strong>Inscrutable</strong> - difficult to understand</div><div class="word"><strong>Inexorable</strong> - impossible to stop</div><div class="word"><strong>Prophetic</strong> - seeming to predict the future</div></div></section>
    <section class="ghost-card marley-card"><h3>Jacob Marley</h3><p>A warning of the spiritual cost of greed and indifference.</p><div class="marley-words">
      <div class="word-list"><div class="word"><strong>Spectral</strong> - ghostly in appearance</div><div class="word"><strong>Chained</strong> - burdened by the chains he forged in life</div><div class="word"><strong>Tormented</strong> - suffering deeply</div><div class="word"><strong>Remorseful</strong> - full of regret</div><div class="word"><strong>Anguished</strong> - showing intense distress</div></div>
      <div class="word-list"><div class="word"><strong>Grave</strong> - serious and solemn</div><div class="word"><strong>Desperate</strong> - urgently seeking to change Scrooge</div><div class="word"><strong>Penitent</strong> - sorrowful about past wrongdoing</div><div class="word"><strong>Prophetic</strong> - warning of what may come</div><div class="word"><strong>Cautionary</strong> - serving as a warning</div></div>
    </div></section>
  </div>`,
  verbs: `<h2>Analytical verbs</h2><p class="section-note">Choose a precise verb that matches the point you are making about Dickens’ choices.</p><div class="verb-grid">
    <section class="verb-card"><h3>To present or describe</h3><p>portrays · depicts · characterises · introduces · establishes · represents</p></section>
    <section class="verb-card"><h3>To criticise or challenge</h3><p>criticises · condemns · challenges · satirises · exposes · undermines</p></section>
    <section class="verb-card"><h3>To highlight or emphasise</h3><p>highlights · emphasises · underscores · reinforces · draws attention to · stresses</p></section>
    <section class="verb-card"><h3>To suggest or reveal</h3><p>suggests · implies · reveals · conveys · evokes · foreshadows</p></section>
    <section class="verb-card"><h3>To compare or contrast</h3><p>contrasts · juxtaposes · parallels · differentiates · distinguishes · compares</p></section>
    <section class="verb-card"><h3>To celebrate or transform</h3><p>celebrates · affirms · humanises · transforms · redeems · praises</p></section>
    <section class="verb-card"><h3>To explain or illustrate</h3><p>demonstrates · illustrates · clarifies · exemplifies · expresses · communicates</p></section>
    <section class="verb-card"><h3>To question or explore</h3><p>questions · interrogates · examines · explores · probes · challenges</p></section>
    <section class="verb-card"><h3>To develop or connect</h3><p>develops · builds · extends · links · reinforces · connects</p></section>
  </div>`,
  starters: `<h2>Sentence starters</h2><p class="section-note">Build a PETAL paragraph: Point, Evidence, Technique, Analysis, Link.</p><div class="starter-groups">
    <section class="starter-group"><h3>Point</h3><ul><li>Dickens presents Scrooge as …</li><li>Across the novella, Scrooge changes from … to …</li><li>Dickens uses the spirits to explore …</li></ul></section>
    <section class="starter-group"><h3>Evidence</h3><ul><li>In Stave …, Scrooge describes … as “…”</li><li>This is clear when Dickens writes, “…”</li><li>When … says “…” …</li></ul></section>
    <section class="starter-group"><h3>Technique</h3><ul><li>Dickens uses the adjective “…” to …</li><li>The metaphor / simile / image of …</li><li>Through the contrast between … and …, Dickens …</li></ul></section>
    <section class="starter-group"><h3>Analysis</h3><ul><li>The word “…” suggests …</li><li>This may make the reader feel … because …</li><li>Dickens could be implying that …</li></ul></section>
    <section class="starter-group"><h3>Link</h3><ul><li>This links to Dickens’ wider message about …</li><li>Like …, this moment highlights …</li><li>By the final stave, Scrooge has become …, showing …</li></ul></section>
  </div>`,
  context: `<h2>Context</h2><p class="section-note">Essay-ready context sentences. Link each one to a character, image or message in the novella.</p><div class="context-grid">
    <section class="context-card"><span class="context-index">01</span><div><h3>Publication and poverty</h3><p>Writing in 1843, Dickens draws attention to the hardship faced by poor families such as the Cratchits.</p></div></section>
    <section class="context-card"><span class="context-index">02</span><div><h3>The Poor Law</h3><p>The 1834 Poor Law Amendment Act made workhouses central to poor relief; Dickens challenges the lack of compassion shown towards people in poverty.</p></div></section>
    <section class="context-card"><span class="context-index">03</span><div><h3>Ignorance and Want</h3><p>Through Ignorance and Want, Dickens warns that neglecting poverty and education harms society as a whole.</p></div></section>
    <section class="context-card"><span class="context-index">04</span><div><h3>Social responsibility</h3><p>By transforming Scrooge, Dickens suggests that people with wealth have a responsibility to help others.</p></div></section>
  </div><div class="context-tip"><strong>Essay tip:</strong> connect the context to Dickens’ purpose. Explain how the character, event or image supports the point you are making.</div>`,
  quotes: `<h2>A Christmas Carol quotes</h2><p class="section-note">Choose a stave to revise ten quotations in story order. Read across each row from left to right.</p><div class="quote-picker" id="quote-picker">
    <button class="quote-picker-trigger" type="button" id="quote-picker-trigger" aria-expanded="false" aria-haspopup="listbox" aria-labelledby="quote-picker-label quote-picker-current"><span class="quote-picker-number" id="quote-picker-number">01</span><span class="quote-picker-current"><small id="quote-picker-label">Selected stave</small><strong id="quote-picker-current">Stave One</strong></span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    <div class="quote-picker-menu" id="quote-picker-menu" role="listbox" aria-label="Choose a stave" hidden>
      <button type="button" class="quote-stave-option" role="option" data-stave="1" aria-selected="true"><span class="quote-option-number">01</span><span><strong>Stave One</strong><small>The miser</small></span><span class="quote-option-check">✓</span></button>
      <button type="button" class="quote-stave-option" role="option" data-stave="2" aria-selected="false"><span class="quote-option-number">02</span><span><strong>Stave Two</strong><small>The first spirit</small></span><span class="quote-option-check">✓</span></button>
      <button type="button" class="quote-stave-option" role="option" data-stave="3" aria-selected="false"><span class="quote-option-number">03</span><span><strong>Stave Three</strong><small>The second spirit</small></span><span class="quote-option-check">✓</span></button>
      <button type="button" class="quote-stave-option" role="option" data-stave="4" aria-selected="false"><span class="quote-option-number">04</span><span><strong>Stave Four</strong><small>The last spirit</small></span><span class="quote-option-check">✓</span></button>
      <button type="button" class="quote-stave-option" role="option" data-stave="5" aria-selected="false"><span class="quote-option-number">05</span><span><strong>Stave Five</strong><small>The end of it</small></span><span class="quote-option-check">✓</span></button>
    </div>
  </div><div class="quote-grid" id="stave-quote-content" aria-live="polite"></div>`
};

const quoteSets = {
  1: [
    ["Narrator · Scrooge", "a squeezing, wrenching, grasping, scraping, clutching, covetous, old sinner!", "The accumulating verbs make Scrooge’s greed seem relentless. The comic exaggeration invites the reader to judge his selfishness."],
    ["Narrator · Scrooge", "solitary as an oyster", "The simile presents Scrooge as closed and difficult to reach. An oyster can also hide a pearl, hinting that a better nature may be concealed beneath his hard exterior."],
    ["Scrooge · to Bob Cratchit", "a poor excuse for picking a man’s pocket every twenty-fifth of December!", "Scrooge treats a paid Christmas holiday as an unfair cost. The irony is that he accuses Bob of taking from him while Dickens exposes Scrooge’s own greed."],
    ["Scrooge · to Fred", "Bah! Humbug!", "The abrupt exclamation dismisses Christmas as foolish. Its repetition makes Scrooge’s rejection of joy and fellowship memorable."],
    ["Scrooge · to the charity collectors", "Are there no prisons?", "The rhetorical question reduces help for the poor to punishment. Dickens exposes Scrooge’s lack of compassion and the cruelty of relying on institutions."],
    ["Scrooge · to the charity collectors", "And the Union workhouses?", "Scrooge treats the workhouse as an adequate answer to poverty. Dickens challenges readers who accept harsh systems instead of offering practical kindness."],
    ["Scrooge · to the charity collectors", "decrease the surplus population", "The dehumanising phrase treats poor people as excess numbers. Dickens criticises a society that values economic convenience over human life."],
    ["Narrator · Scrooge’s office", "Darkness is cheap, and Scrooge liked it.", "The present-tense observation turns Scrooge’s penny-pinching into a general habit. Dickens makes his miserliness seem to shape the darkness of his whole world."],
    ["Marley · to Scrooge", "I wear the chain I forged in life.", "The chain symbolises the consequences Marley created through his choices. “Forged” suggests he built his own burden link by link."],
    ["Marley · to Scrooge", "Mankind was my business.", "Marley redefines “business” as responsibility for humanity. His regret introduces Dickens’ central argument that compassion matters more than profit." ]
  ],
  2: [
    ["The Ghost of Christmas Past", "I am the Ghost of Christmas Past.", "The spirit’s name makes memory the focus of Scrooge’s first lesson. The calm introduction contrasts with Scrooge’s fear."],
    ["The Ghost of Christmas Past", "Your past.", "The brief correction makes the lesson personal: Scrooge must confront his own history, not an abstract past."],
    ["Narrator · Scrooge at school", "A solitary child, neglected by his friends, is left there still.", "The isolated child recalls Scrooge’s loneliness. Dickens helps the reader understand his past without excusing the cruelty he later chooses."],
    ["Scrooge · remembering his schooldays", "Why, it’s Ali Baba! It’s dear old honest Ali Baba!", "The joyful recognition shows the imaginative worlds that once comforted the lonely child. Memory begins to soften Scrooge."],

    ["Fezziwig · at the warehouse", "No more work to-night. Christmas Eve, Dick. Christmas, Ebenezer!", "Fezziwig’s joyful announcement transforms the workplace into a place of celebration and community."],
    ["Scrooge · remembering Fezziwig", "He has the power to render us happy or unhappy; to make our service light or burdensome; a pleasure or a toil.", "Scrooge recognises that an employer’s treatment can shape workers’ lives. The reflection prepares him to reconsider his own treatment of Bob."],
    ["Belle · ending the engagement", "Another idol has displaced me... a golden one.", "The metaphor presents wealth as a false object of worship that has replaced love in Scrooge’s priorities."],
    ["Belle · explaining Scrooge’s change", "You fear the world too much.", "Belle identifies fear of poverty and social judgement beneath Scrooge’s pursuit of wealth. Her insight makes the breakup feel like the result of his choices."],
    ["Belle · leaving Scrooge", "May you be happy in the life you have chosen!", "Belle’s farewell makes Scrooge confront the human cost of choosing wealth over affection. The moment helps explain his later regret."]

function decorateWordChips() {
  document.querySelectorAll('.word-chip').forEach(chip => {
    const word = chip.textContent.trim().toLowerCase();
    const definition = wordDefinitions[word] || "A useful adjective for describing Scrooge.";
    chip.dataset.tooltip = definition;
    chip.title = definition;
    chip.tabIndex = 0;
    chip.setAttribute('aria-label', word + ": " + definition);
  });
}
const picker = document.getElementById('picker');
const trigger = document.getElementById('picker-trigger');
const menu = document.getElementById('topic-menu');
const title = document.getElementById('current-topic');
const bank = document.getElementById('bank');
const options = [...document.querySelectorAll('.menu-option')];
function setMenu(open) { picker.classList.toggle('open', open); trigger.setAttribute('aria-expanded', String(open)); menu.hidden = !open; }
function choose(option) {
  const key = option.dataset.topic;
  options.forEach(item => item.setAttribute('aria-selected', String(item === option)));
  title.textContent = option.textContent.trim();
  bank.innerHTML = banks[key];
  if (key === 'quotes') renderQuoteSet(1);
  decorateWordChips();
  setMenu(false);
}
trigger.addEventListener('click', () => setMenu(menu.hidden));
options.forEach(option => option.addEventListener('click', () => choose(option)));
document.addEventListener('click', event => { if (!picker.contains(event.target)) setMenu(false); });
function escapeHTML(value) { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]); }
const staveNames = { 1: ['Stave One', 'The miser'], 2: ['Stave Two', 'The first spirit'], 3: ['Stave Three', 'The second spirit'], 4: ['Stave Four', 'The last spirit'], 5: ['Stave Five', 'The end of it'] };
function setQuoteMenu(open) {
  const root = document.getElementById('quote-picker');
  const button = document.getElementById('quote-picker-trigger');
  const dropdown = document.getElementById('quote-picker-menu');
  if (!root || !button || !dropdown) return;
  root.classList.toggle('open', open);
  button.setAttribute('aria-expanded', String(open));
  dropdown.hidden = !open;
}
function renderQuoteSet(staveNumber) {
  const content = document.getElementById('stave-quote-content');
  const entries = quoteSets[staveNumber] || [];
  if (!content) return;
  const [staveTitle, subtitle] = staveNames[staveNumber];
  const number = String(staveNumber).padStart(2, '0');
  document.getElementById('quote-picker-number').textContent = number;
  document.getElementById('quote-picker-current').textContent = staveTitle;
  document.querySelectorAll('.quote-stave-option').forEach(option => option.setAttribute('aria-selected', String(Number(option.dataset.stave) === staveNumber)));
  content.innerHTML = entries.map(([speaker, quote, analysis], index) => `<article class="quote-card"><span class="quote-number">${String(index + 1).padStart(2, '0')}</span><p class="quote-meta">${escapeHTML(speaker)}</p><blockquote>“${escapeHTML(quote)}”</blockquote><p>${escapeHTML(analysis)}</p></article>`).join('');
  const sub = document.querySelector('.quote-picker-current small');
  if (sub) sub.textContent = subtitle;
}
document.addEventListener('click', event => {
  if (event.target.closest('#quote-picker-trigger')) {
    const button = document.getElementById('quote-picker-trigger');
    setQuoteMenu(button.getAttribute('aria-expanded') !== 'true');
    return;
  }
  const option = event.target.closest('.quote-stave-option');
  if (option) { renderQuoteSet(Number(option.dataset.stave)); setQuoteMenu(false); return; }
  const root = document.getElementById('quote-picker');
  if (root && !root.contains(event.target)) setQuoteMenu(false);
});
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  if (!menu.hidden) { setMenu(false); trigger.focus(); }
  const quoteTrigger = document.getElementById('quote-picker-trigger');
  if (quoteTrigger?.getAttribute('aria-expanded') === 'true') { setQuoteMenu(false); quoteTrigger.focus(); }
});
showInitial();
function showInitial() { bank.innerHTML = banks.scrooge; decorateWordChips(); }
</script>
